{% extends 'sportsmen/base.html' %}

{% block content %}
<h1>{{ post.title }}</h1>
{% if post.photo %}
    <p><img class="img-article-left" src="{{ post.photo.url }}" width="200"></p>
{% endif %}
<p>{{ post.content|linebreaks }}</p>
<p><a href="{% url 'index' %}">Back to list</a></p>
{% endblock %}
